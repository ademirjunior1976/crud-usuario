<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="ISO-8859-1">
    <title>Manter Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">


<style type="text/css">

html{
	margin-left: 5%;
	margin-right: 5%;
	margin-top: 5%;
}




</style>



  </head>
<body>

  <h2> Manter Usuários by Ademir Jr. (Java / Spring / PostreSQL)</h2>

  <form action="" id="frmManterUsuario">
  
    <div class="mb-3">
      <label for="id" class="form-label">Id</label>
      <input type="text" class="form-control" id= "id" readonly="read only">
    </div>

    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" class="form-control" id="nome" placeholder="Informe o nome do usuário" required="required">
    </div>
    
    <div class="mb-3">
      <label for="idade" class="form-label">Idade</label>
      <input type="number" class="form-control" id="idade" placeholder="Informe a idade do usuário">
    </div>
  
  </form>

  <button type="button" class="btn btn-primary" onclick="salvarusuario()">Salvar</button>
  <button type="button" class="btn btn-primary" onclick="document.getElementById('frmManterUsuario').reset();">Novo</button>
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPesquisarUsuario" data-bs-whatever="@getbootstrap">Pesquisar</button>
  <button type="button" class="btn btn-primary" onclick="deletarusuarioinicio()">Deletar</button>

  <div class="modal fade" id="modalPesquisarUsuario" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Pesquisar Usuário</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="pesquisarUsuario" class="col-form-label">Nome do Usuário:</label>
              <input type="text" class="form-control" id="nomeusuariopesquisar">
            </div>

            <button type="button" class="btn btn-primary" onclick="pesquisarnomeusuario()">Buscar</button>
            <button type="button" class="btn btn-primary" onclick="listacompletausuario()">Todos</button>

          </form>

			<div style="height: 300px; overflow: scroll;">
	            <table class="table" id="tabelapesquisar">
				  <thead>
					<tr>
					  <th scope="col">Id</th>
					  <th scope="col">Nome</th>
					  <th scope="col">Editar</th>
					  <th scope="col">Deletar</th>
					</tr>
				  </thead>
					<tbody>
	
	
	
					</tbody>
			</table>
			</div>


        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>

  <script type="text/javascript">



    function salvarusuario(){
	    var id    = $("#id").val();
		var nome  = $("#nome").val();
		var idade = $("#idade").val();
		
		if (nome == null || nome != null && nome.trim() ==''){
			$("#nome").focus();
			alert('Informe nome !!!');
			return;
		}
		
		if (idade == null || idade != null && idade.trim() ==''){
			$("#idade").focus();
			alert('Informe a idade !!!');
			return;
		}
		
	    $.ajax({
		method:"POST",
		url:"salvar",
		data: JSON.stringify({id: id, nome: nome, idade: idade}),
		contentType: "application/json; charset=utf-8",
		success: function(response){

			$("#id").val(response.id);
			alert("Dados gravados com sucesso !!!");
		}
	      }).fail(function(xhr, status, errorThrown){
		alert("Erro ao salvar o usuario: "+ xhr.responseText);
	      });
    } 



    function pesquisarnomeusuario(){
      	var nome_pesquisar = $('#nomeusuariopesquisar').val();
      	
      	if (nome_pesquisar != null && nome_pesquisar.trim() != ''){ 
      		$.ajax({
              	method:"GET",
              	url:"buscarpornome",
              	data:"nome="+nome_pesquisar,

              	success: function(response){
                  $('#tabelapesquisar > tbody > tr').remove();
                  for (var i=0; i < response.length; i++){
                      $('#tabelapesquisar > tbody').append('<tr id="'+response[i].id+'"><td>'+response[i].id+'</td><td>'+response[i].nome+'</td><td> <button type="button" onclick="editarusuario('+response[i].id+')" class="btn btn-primary">Editar</button> </td><td> <button type="button" onclick="deletarusuario('+response[i].id+')" class="btn btn-primary">Deletar</button> </td></tr>');
 
                  }
              	}
              }).fail(function(xhr, status, errorThrown){
              	alert("Erro ao pesquisar o usuário: "+ xhr.responseText);
              });
      	}
      }  

    
	function editarusuario(pid){
  		$.ajax({
          	method:"GET",
          	url:"buscaruserid",
          	data:"iduser="+pid,

          	success: function(response){

        	    $("#id").val(response.id);
        		$("#nome").val(response.nome);
        		$("#idade").val(response.idade); 
        		
        		$('#modalPesquisarUsuario').modal('hide');
          		
          		
          	}
          }).fail(function(xhr, status, errorThrown){
          	alert("Erro ao editar usuário por id: "+ xhr.responseText);
          });
	}       
    
	
	function deletarusuario(pid){

		if (confirm('Deseja realmente deletar ?')) {
			$.ajax({
	          	method:"DELETE",
	          	url:"deletar",
	          	data:"iduser="+pid,
	          	success: function(response){
	          		
	          		$('#'+ pid).remove();
	          		alert(response);
	
	          	}
	          }).fail(function(xhr, status, errorThrown){
	          	alert("Erro ao deletar usuário por id: "+ xhr.responseText);
	          });
		}
	} 
	

	function deletarusuarioinicio(){
		var id    = $('#id').val();

		if (id == null || id != null && id.trim() ==''){
			alert('Favor pesquisar o usuario para deletar !!!');
			return;
		}		
		
		if (id != null && id.trim() != ''){
			deletarusuario(id);
			document.getElementById('frmManterUsuario').reset();
		}
		
	} 	
	

	
	
	
	
  </script>

</body>
